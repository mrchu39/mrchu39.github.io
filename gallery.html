<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Matthew R. Chu</title>
    <style>
        :root { --bg: #ffffff; --text: #333333; --text-light: #777777; --border: #eeeeee; --accent: #111111; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.8; margin: 0; padding: 0 20px; }
        .container { max-width: 900px; margin: 0 auto; padding-bottom: 4rem; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 3rem 0; margin-bottom: 2rem; border-bottom: 1px solid var(--border); }
        @media (max-width: 768px) { header { flex-direction: column; gap: 1rem; align-items: flex-start; } }
        .site-title { font-size: 1.2rem; font-weight: 600; text-decoration: none; color: var(--accent); letter-spacing: -0.5px; }
        nav { display: flex; flex-wrap: wrap; gap: 1.5rem; }
        nav a { text-decoration: none; color: var(--text-light); font-size: 0.95rem; transition: color 0.2s; }
        nav a:hover, nav a.active { color: var(--accent); font-weight: 500; }
        
        h1 { font-size: 2rem; font-weight: 600; margin-bottom: 2rem; color: var(--accent); }
        
        /* Gallery Grid Layout */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        
        .gallery-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            background: #f9f9f9;
        }
        
        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.03);
        }
        
        .caption {
            padding: 1rem;
            font-size: 0.9rem;
            color: var(--text-light);
            background: #fff;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="site-title">Matthew R. Chu</a>
            <nav>
                <a href="index.html">Home</a>
                <a href="experience.html">Experience & Education</a>
                <a href="publications.html">Publications</a>
                <a href="coursework.html">Coursework</a>
                <a href="gallery.html" class="active">Gallery</a>
            </nav>
        </header>

        <main>
            <h1>Gallery</h1>
            
            <div class="gallery-grid">
                <div class="gallery-item">
                    <img src="https://via.placeholder.com/600x400/f4f6f8/777777?text=Photo+1" alt="Description">
                    <div class="caption">Working with the SAT-I telescope instrumentation.</div>
                </div>

                <div class="gallery-item">
                    <img src="https://via.placeholder.com/600x400/f4f6f8/777777?text=Photo+2" alt="Description">
                    <div class="caption">Observatory visit at Palomar.</div>
                </div>

                <div class="gallery-item">
                    <img src="https://via.placeholder.com/600x400/f4f6f8/777777?text=Photo+3" alt="Description">
                    <div class="caption">Physics Graduate Council outreach event.</div>
                </div>

                <div class="gallery-item">
                    <img src="https://via.placeholder.com/600x400/f4f6f8/777777?text=Photo+4" alt="Description">
                    <div class="caption">Calibrating equipment at the Space Dynamics Laboratory.</div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
